version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    IMAGE_TAG: latest
    # ECR_REPO is injected by CodeBuild project environment variables from Terraform

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}

  build:
    commands:
      - echo Building Docker image...
      - docker build -t $ECR_REPO:$IMAGE_TAG -f infrastructure/docker/Dockerfile .
      - docker tag $ECR_REPO:$IMAGE_TAG $ECR_REPO:latest

  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push $ECR_REPO:$IMAGE_TAG
      - docker push $ECR_REPO:latest
      # Generate separate ECS image definitions for web and worker services
      - printf '[{"name":"web","imageUri":"%s"}]' $ECR_REPO:$IMAGE_TAG > imagedefinitions-web.json
      - printf '[{"name":"worker","imageUri":"%s"}]' $ECR_REPO:$IMAGE_TAG > imagedefinitions-worker.json
      - echo Build completed on `date`

artifacts:
  files:
    - imagedefinitions-web.json
    - imagedefinitions-worker.json
