[pytest]
# Digestor Unified - Pytest Configuration
# Run from repo root: pytest

testpaths = tests
pythonpath = backend

# Async mode: auto-detect async test functions
asyncio_mode = auto

# Markers
markers =
    asyncio: async test functions
    slow: tests that take > 5 seconds (e.g., LLM calls)
    integration: end-to-end integration tests

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    -q

# Ignore frontend node_modules and infrastructure
norecursedirs =
    frontend
    infrastructure
    node_modules
    .git
    __pycache__
    .venv
