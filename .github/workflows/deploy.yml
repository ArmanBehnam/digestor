name: Build & Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: digetor
  ECS_CLUSTER: digestor-dev
  WEB_SERVICE: digestor-web-dev
  WORKER_SERVICE: digestor-worker-dev
  WEB_TASKDEF: infrastructure/ecs/taskdef-web.json
  WORKER_TASKDEF: infrastructure/ecs/taskdef-worker.json

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -f infrastructure/docker/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Get the image digest for deterministic deploys
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG | cut -d@ -f2)
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Image: $IMAGE"

      # --- Inject secrets into task definitions ---
      - name: Prepare web task definition
        run: |
          sed -i 's|IMAGE_PLACEHOLDER|${{ steps.build-image.outputs.image }}|g' $WEB_TASKDEF
          sed -i 's|DATABASE_URL_PLACEHOLDER|${{ secrets.DATABASE_URL }}|g' $WEB_TASKDEF
          sed -i 's|REDIS_URL_PLACEHOLDER|${{ secrets.REDIS_URL }}|g' $WEB_TASKDEF
          sed -i 's|OPENAI_API_KEY_PLACEHOLDER|${{ secrets.OPENAI_API_KEY }}|g' $WEB_TASKDEF
          sed -i 's|AZURE_API_KEY_PLACEHOLDER|${{ secrets.AZURE_API_KEY }}|g' $WEB_TASKDEF
          sed -i 's|AZURE_ENDPOINT_PLACEHOLDER|${{ secrets.AZURE_ENDPOINT }}|g' $WEB_TASKDEF

      - name: Prepare worker task definition
        run: |
          sed -i 's|IMAGE_PLACEHOLDER|${{ steps.build-image.outputs.image }}|g' $WORKER_TASKDEF
          sed -i 's|DATABASE_URL_PLACEHOLDER|${{ secrets.DATABASE_URL }}|g' $WORKER_TASKDEF
          sed -i 's|REDIS_URL_PLACEHOLDER|${{ secrets.REDIS_URL }}|g' $WORKER_TASKDEF
          sed -i 's|OPENAI_API_KEY_PLACEHOLDER|${{ secrets.OPENAI_API_KEY }}|g' $WORKER_TASKDEF
          sed -i 's|AZURE_API_KEY_PLACEHOLDER|${{ secrets.AZURE_API_KEY }}|g' $WORKER_TASKDEF
          sed -i 's|AZURE_ENDPOINT_PLACEHOLDER|${{ secrets.AZURE_ENDPOINT }}|g' $WORKER_TASKDEF

      # --- Register and deploy web service ---
      - name: Register web task definition
        id: web-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.WEB_TASKDEF }}
          container-name: web
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-taskdef.outputs.task-definition }}
          service: ${{ env.WEB_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 5

      # --- Register and deploy worker service ---
      - name: Register worker task definition
        id: worker-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.WORKER_TASKDEF }}
          container-name: worker
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-taskdef.outputs.task-definition }}
          service: ${{ env.WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 5

      # --- Health check ---
      - name: Verify deployment
        run: |
          # Dynamically fetch ALB DNS from ECS/ALB instead of hardcoding
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "digestor-dev" \
            --query "LoadBalancers[0].DNSName" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "ERROR: Could not resolve ALB DNS name"
            exit 1
          fi

          echo "ALB DNS: $ALB_DNS"
          echo "Waiting 30s for services to stabilize..."
          sleep 30

          echo "Checking health endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$ALB_DNS/api/health" --max-time 15)

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Health check passed (HTTP $HTTP_STATUS)"
          else
            echo "Health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
